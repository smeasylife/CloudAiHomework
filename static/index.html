<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>질문 생성기</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>질문 생성기</h1>

      <section class="step">
        <button id="ingestButton" type="button">생기부 넣기</button>
        <input id="pdfInput" type="file" accept="application/pdf" hidden style="display: none" />
        <p id="ingestResult">대기 중</p>
      </section>

      <section class="step">
        <h2>생성 조건</h2>

        <div class="field">
          <label for="schoolInput">지원 대학</label>
          <input id="schoolInput" type="text" value="한양대학교" />
        </div>

        <div class="field">
          <label for="majorInput">지원 학과</label>
          <input id="majorInput" type="text" value="컴퓨터공학과" />
        </div>

        <div class="field">
          <label for="interviewTypeInput">전형</label>
          <input id="interviewTypeInput" type="text" value="학생부종합" />
        </div>

        <button id="generateButton" type="button" disabled>질문 생성</button>
      </section>

      <section class="step">
        <h2>생성 질문</h2>
        <div id="questionGroups">생기부를 준비한 뒤 질문을 생성하세요.</div>
      </section>
    </main>

    <script src="/static/app.js?v=2"></script>
  </body>
</html>
